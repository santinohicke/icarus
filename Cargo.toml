[workspace]
resolver = "3"
members = ["crates/icarus-core", "crates/icarus-wasm", "crates/icarus-py"]
default-members = ["crates/icarus-core", "crates/icarus-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/santinohicke/icarus"

[workspace.dependencies]
icarus-core = { path = "crates/icarus-core" }
# Pinned exactly: the golden parity trajectories depend on libm's bit-level output.
libm = "=0.2.16"
base64 = "0.23"
wasm-bindgen = "=0.2.130"
pyo3 = "0.30.1"

[workspace.lints.rust]
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
float_cmp = "allow"
suboptimal_flops = "allow" # suggests mul_add (FMA), which we ban for determinism

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
