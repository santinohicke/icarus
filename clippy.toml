# Determinism guard: the simulation must produce bit-identical results on every
# target (native and WebAssembly). The standard library's transcendental
# functions call the platform math library and may differ across targets, so
# they are banned in favor of the pure-Rust `libm` crate. `mul_add` is banned
# because fused multiply-add rounds differently from a separate mul + add.
disallowed-methods = [
    { path = "f64::sin", reason = "use libm::sin (determinism across targets)" },
    { path = "f64::cos", reason = "use libm::cos (determinism across targets)" },
    { path = "f64::tan", reason = "use libm::tan (determinism across targets)" },
    { path = "f64::sin_cos", reason = "use libm::sin and libm::cos (determinism across targets)" },
    { path = "f64::asin", reason = "use libm::asin (determinism across targets)" },
    { path = "f64::acos", reason = "use libm::acos (determinism across targets)" },
    { path = "f64::atan", reason = "use libm::atan (determinism across targets)" },
    { path = "f64::atan2", reason = "use libm::atan2 (determinism across targets)" },
    { path = "f64::exp", reason = "use libm::exp (determinism across targets)" },
    { path = "f64::exp2", reason = "use libm::exp2 (determinism across targets)" },
    { path = "f64::ln", reason = "use libm::log (determinism across targets)" },
    { path = "f64::log10", reason = "use libm::log10 (determinism across targets)" },
    { path = "f64::log2", reason = "use libm::log2 (determinism across targets)" },
    { path = "f64::powf", reason = "use libm::pow (determinism across targets)" },
    { path = "f64::powi", reason = "use explicit multiplication or libm::pow (powi may expand differently)" },
    { path = "f64::hypot", reason = "use libm::hypot (determinism across targets)" },
    { path = "f64::tanh", reason = "use libm::tanh (determinism across targets)" },
    { path = "f64::sinh", reason = "use libm::sinh (determinism across targets)" },
    { path = "f64::cosh", reason = "use libm::cosh (determinism across targets)" },
    { path = "f64::cbrt", reason = "use libm::cbrt (determinism across targets)" },
    { path = "f64::round", reason = "use libm::round (keeps all rounding in one place)" },
    { path = "f64::mul_add", reason = "fused multiply-add rounds differently; write a * b + c" },
    { path = "f64::ln_1p", reason = "use libm::log1p (determinism across targets)" },
    { path = "f64::exp_m1", reason = "use libm::expm1 (determinism across targets)" },
    { path = "f64::log", reason = "use libm::log / libm::log (determinism across targets)" },
    { path = "f64::asinh", reason = "use libm::asinh (determinism across targets)" },
    { path = "f64::acosh", reason = "use libm::acosh (determinism across targets)" },
    { path = "f64::atanh", reason = "use libm::atanh (determinism across targets)" },
    { path = "f32::sin", reason = "use libm::sinf (determinism across targets)" },
    { path = "f32::cos", reason = "use libm::cosf (determinism across targets)" },
    { path = "f32::tan", reason = "use libm::tanf (determinism across targets)" },
    { path = "f32::sin_cos", reason = "use libm::sinf and libm::cosf (determinism across targets)" },
    { path = "f32::asin", reason = "use libm::asinf (determinism across targets)" },
    { path = "f32::acos", reason = "use libm::acosf (determinism across targets)" },
    { path = "f32::atan", reason = "use libm::atanf (determinism across targets)" },
    { path = "f32::atan2", reason = "use libm::atan2f (determinism across targets)" },
    { path = "f32::exp", reason = "use libm::expf (determinism across targets)" },
    { path = "f32::exp2", reason = "use libm::exp2f (determinism across targets)" },
    { path = "f32::exp_m1", reason = "use libm::expm1f (determinism across targets)" },
    { path = "f32::ln", reason = "use libm::logf (determinism across targets)" },
    { path = "f32::ln_1p", reason = "use libm::log1pf (determinism across targets)" },
    { path = "f32::log", reason = "use libm::logf (determinism across targets)" },
    { path = "f32::log10", reason = "use libm::log10f (determinism across targets)" },
    { path = "f32::log2", reason = "use libm::log2f (determinism across targets)" },
    { path = "f32::powf", reason = "use libm::powf (determinism across targets)" },
    { path = "f32::powi", reason = "use explicit multiplication or libm::powf (powi may expand differently)" },
    { path = "f32::hypot", reason = "use libm::hypotf (determinism across targets)" },
    { path = "f32::tanh", reason = "use libm::tanhf (determinism across targets)" },
    { path = "f32::sinh", reason = "use libm::sinhf (determinism across targets)" },
    { path = "f32::cosh", reason = "use libm::coshf (determinism across targets)" },
    { path = "f32::asinh", reason = "use libm::asinhf (determinism across targets)" },
    { path = "f32::acosh", reason = "use libm::acoshf (determinism across targets)" },
    { path = "f32::atanh", reason = "use libm::atanhf (determinism across targets)" },
    { path = "f32::cbrt", reason = "use libm::cbrtf (determinism across targets)" },
    { path = "f32::round", reason = "use libm::roundf (keeps all rounding in one place)" },
    { path = "f32::mul_add", reason = "fused multiply-add rounds differently; write a * b + c" },
]

# Note on f64::min / f64::max / clamp: they are deterministic except that the
# sign of a zero result may differ between targets when comparing -0.0 with
# +0.0. Every call site in the core feeds such results into operations where
# the sign of zero cannot change the outcome (sums with non-zero terms, exp).
# Keep it that way: never divide by, or take atan2/copysign of, a min/max
# result that can be zero.
