<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Land a reusable rocket first stage by hand. Deterministic Rust physics running in WebAssembly." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1220'/%3E%3Cpath d='M16 4 L19 10 L19 22 L13 22 L13 10 Z' fill='%23e6edf7'/%3E%3Cpath d='M13 22 L8 27 M19 22 L24 27' stroke='%23e6edf7' stroke-width='1.6'/%3E%3Cpath d='M14.5 23 L16 29 L17.5 23 Z' fill='%23ffb347'/%3E%3C/svg%3E" />
    <title>Icarus</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view" role="img" aria-label="Rocket landing simulation"></canvas>

    <header class="topbar">
      <div class="brand">ICARUS <span class="tag">GNC SIM</span></div>
      <div class="config" role="group" aria-label="Difficulty">
        <button type="button" data-config="easy" title="Can hover, engine running (1)">Easy</button>
        <button type="button" data-config="realistic" title="Cannot hover: one ignition, hoverslam (2)">Realistic</button>
      </div>
      <div class="actions">
        <span class="seed" title="Scenario seed">SEED <span id="seed">—</span></span>
        <button type="button" id="btn-pause" title="Pause (P)">Pause</button>
        <button type="button" id="btn-restart" title="Restart this scenario (R)">Retry</button>
        <button type="button" id="btn-new" title="New random scenario (N)">New</button>
      </div>
    </header>

    <aside class="hud" id="hud" aria-live="off"></aside>

    <div class="overlay" id="overlay" hidden>
      <div class="card" id="overlay-card" role="dialog" aria-modal="true" aria-labelledby="overlay-title" aria-live="polite"></div>
    </div>

    <footer class="help">
      <span><kbd>↑</kbd><kbd>↓</kbd> throttle</span>
      <span><kbd>←</kbd><kbd>→</kbd> gimbal</span>
      <span><kbd>Q</kbd><kbd>E</kbd> RCS</span>
      <span><kbd>X</kbd> cut engine</span>
      <span><kbd>Z</kbd> full throttle</span>
      <span><kbd>P</kbd> pause</span>
      <span><kbd>R</kbd> retry</span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
