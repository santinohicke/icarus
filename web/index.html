<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Land a reusable rocket first stage by hand. Deterministic Rust physics running in WebAssembly." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1220'/%3E%3Cpath d='M16 4 L19 10 L19 22 L13 22 L13 10 Z' fill='%23e6edf7'/%3E%3Cpath d='M13 22 L8 27 M19 22 L24 27' stroke='%23e6edf7' stroke-width='1.6'/%3E%3Cpath d='M14.5 23 L16 29 L17.5 23 Z' fill='%23ffb347'/%3E%3C/svg%3E" />
    <title>Icarus</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view" role="img" aria-label="Rocket landing simulation"></canvas>

    <header class="topbar">
      <button type="button" class="brand" id="btn-menu" title="Main menu">ICARUS</button>
      <span class="mission" id="mission"></span>
      <div class="actions">
        <span class="seed" title="Scenario seed">SEED <span id="seed">—</span></span>
        <span class="seed" title="Your best score on this mission (stored in this browser)">BEST <span id="best">—</span></span>
        <button type="button" id="btn-charts" title="Telemetry charts" aria-pressed="false">Charts</button>
        <button type="button" id="btn-sound" title="Sound effects" aria-pressed="true">Sound</button>
        <button type="button" id="btn-pause" title="Pause (Esc)">Pause</button>
      </div>
    </header>

    <aside class="hud" id="hud" aria-live="off"></aside>

    <aside class="charts" id="charts" aria-label="Telemetry charts" hidden></aside>

    <div class="replay-bar" id="replay-bar" hidden>
      <span id="replay-label">REPLAY</span>
      <button type="button" id="btn-speed" title="Playback speed">1×</button>
      <button type="button" id="btn-exit-replay">Fly this scenario</button>
    </div>

    <div class="touch-controls" id="touch"></div>

    <div class="overlay" id="overlay" hidden>
      <div class="card" id="overlay-card" role="dialog" aria-modal="true" aria-labelledby="overlay-title" aria-live="polite"></div>
    </div>

    <footer class="help">
      <span><kbd>↑</kbd><kbd>↓</kbd> throttle</span>
      <span><kbd>←</kbd><kbd>→</kbd> steer</span>
      <span><kbd>Q</kbd><kbd>E</kbd> RCS</span>
      <span><kbd>X</kbd> cut engine</span>
      <span><kbd>Esc</kbd> pause</span>
    </footer>

    <section class="menu" id="menu" aria-label="Main menu" hidden></section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
