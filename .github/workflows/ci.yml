name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Must equal the wasm-bindgen crate version in Cargo.lock (checked below).
  WASM_BINDGEN_VERSION: "0.2.130"

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5 # pyo3's build script needs an interpreter
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build the WebAssembly crate on its own (no workspace feature unification)
        run: cargo build -p icarus-wasm --release --target wasm32-unknown-unknown --locked

  python-parity:
    name: Python + golden parity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Goldens are committed from one machine; checking them on other
        # OSes and CPU architectures (x86_64, arm64) is the cross-platform proof.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the extension, the training stack (CPU PyTorch) and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest ruff numpy gymnasium stable-baselines3 pyyaml tensorboard ./crates/icarus-py
      - name: Lint
        run: |
          ruff check training parity
          ruff format --check training parity
      - name: Tests (including the native module against the committed goldens)
        working-directory: training
        # Every optional-dependency skip is an error in CI: the Gymnasium and
        # Stable-Baselines3 adapters must actually be tested.
        run: python -m pytest -p no:cacheprovider
        env:
          ICARUS_REQUIRE_ALL_TESTS: "1"
          RAYON_NUM_THREADS: "2"

  web:
    name: WebAssembly parity + web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - name: wasm-bindgen CLI matches the locked crate version
        working-directory: .
        run: |
          locked=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cli=$(wasm-bindgen --version | awk '{print $2}')
          echo "Cargo.lock: $locked, CLI: $cli"
          test "$locked" = "$cli"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run wasm
      - name: WebAssembly matches the goldens bit for bit
        run: node ../parity/verify_wasm.mjs
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
