name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

# Builds, re-checks parity and deploys to Cloudflare Pages (icarus-ai.pages.dev).
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WASM_BINDGEN_VERSION: "0.2.130"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - name: wasm-bindgen CLI matches the locked crate version
        working-directory: .
        run: |
          locked=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cli=$(wasm-bindgen --version | awk '{print $2}')
          echo "Cargo.lock: $locked, CLI: $cli"
          test "$locked" = "$cli"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run wasm
      # Never publish a build whose physics differs from the goldens.
      - run: node ../parity/verify_wasm.mjs
      - run: npx vitest run
      - run: npm run build
      # Deploys only when the Cloudflare secrets are configured (forks and new
      # clones still build and test). The token is exposed to this step only.
      - name: Check for Cloudflare credentials
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: if [ -n "$TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name icarus-ai --branch main --commit-hash "$GITHUB_SHA"
